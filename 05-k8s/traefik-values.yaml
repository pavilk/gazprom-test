deployment:
  kind: DaemonSet

hostNetwork: true

ports:
  web:
    port: 80

service:
  enabled: false

updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
securityContext:
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
