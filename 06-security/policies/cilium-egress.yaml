apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hello-app-egress
  namespace: hello-app
spec:
  endpointSelector:
    matchLabels:
      app: hello-app
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: istio-system
            app: istiod
      toPorts:
        - ports:
            - port: "15012"
              protocol: TCP
    - toCIDR:
        - 77.88.8.8/32
      icmps:
        - fields:
            - type: 8
              family: IPv4
