apiVersion: v1
kind: ResourceQuota
metadata:
  name: hello-app
  namespace: hello-app
spec:
  hard:
    pods: "6"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: hello-app
  namespace: hello-app
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 512Mi
